services:
  # Notes Application from Docker Hub
  notes-app:
    image: gauravshet91/notesapp1:latest
    container_name: notes-app-hub
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=your-super-secret-session-key-change-this
      - DB_PATH=/app/data/notes.db
    volumes:
      - notes_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/user', (res) => { process.exit(res.statusCode === 401 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - notes-network

  # Nginx Reverse Proxy with HTTPS/HTTP2
  nginx:
    image: nginx:alpine
    container_name: notes-nginx-hub
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - notes-app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - notes-network

networks:
  notes-network:
    driver: bridge

volumes:
  notes_data:
    driver: local
