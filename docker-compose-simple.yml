services:
  # Complete Notes App with Frontend + Backend + Nginx
  notes-app-simple:
    build:
      context: .
      dockerfile: Dockerfile-simple
    container_name: notes-app-simple
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS
      - "8444:8444"   # HTTP/2
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=your-super-secret-session-key-change-this
      - DB_PATH=/app/data/notes.db
    volumes:
      - notes_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/user', (res) => { process.exit(res.statusCode === 401 ? 0 : 1) })"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  notes_data:
    driver: local
